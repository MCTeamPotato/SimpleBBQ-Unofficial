plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'maven-publish'
}

version = "$mod_version-$version_label"
group = 'com.sihenzhang.simplebbq'
base.archivesName = "$mod_name-fabric-$minecraft_version"

var generatedResources = "src/generated/resources"

sourceSets.main.resources {
    srcDir generatedResources
}

loom {
    accessWidenerPath = file("src/main/resources/simplebbq.accesswidener")

    runs {
        datagen {
            client()

            name "Data Generation"
            property "fabric-api.datagen"
            property "fabric-api.datagen.output-dir", file(generatedResources).absolutePath
            property "fabric-api.datagen.modid", mod_id
            property "porting_lib.datagen.existing_resources", file("src/main/resources").absolutePath
        }
    }
}

repositories {
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }

    maven {
        name = "blamejared"
        url = "https://maven.blamejared.com"
        content {
            includeGroup "mezz.jei"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://mvn.devos.one/snapshots/" }
    maven { url "https://maven.shedaniel.me/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.minecraft_version}:${project.parchment_mappings}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
    modImplementation("maven.modrinth:forge-config-api-port:${project.forgeconfigapiport_version}") { transitive = false }

    for (String module in portinglib_modules.split(",")) {
        modImplementation(include("io.github.fabricators_of_create.Porting-Lib:${module}:${project.portinglib_version}")) { transitive = false }
    }

    modCompileOnly "mezz.jei:jei-${minecraft_version}-lib:${jei_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"

    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${rei_version}"

    if (recipeViewer == "jei") {
        modRuntimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
    } else if (recipeViewer == "rei") {
        modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"
    }

    implementation("javax.annotation:javax.annotation-api:1.3.2")
    implementation("com.google.code.findbugs:jsr305:3.0.2")
    implementation("com.electronwill.night-config:toml:3.8.0")
    implementation("com.electronwill.night-config:core:3.8.0")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    toolchain.languageVersion = JavaLanguageVersion.of(21)

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
