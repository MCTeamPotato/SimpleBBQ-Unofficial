plugins {
    id "net.neoforged.moddev.legacyforge" version "2.0.78"
}

version = "$mod_version-$version_label"
group = 'com.sihenzhang.simplebbq'
base.archivesName = "$mod_name-forge-$minecraft_version"

legacyForge {
    version = "$project.minecraft_version-$project.forge_version"

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    parchment {
        mappingsVersion = project.mappings_version
        minecraftVersion = project.minecraft_version
    }

    runs {
        client {
            client()

            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        simplebbq {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = "blamejared"
        url = "https://maven.blamejared.com"
        content {
            includeGroup "mezz.jei"
        }
    }

    maven { url "https://maven.shedaniel.me/" }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}
obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

dependencies {
    compileOnly "org.jetbrains:annotations:24.0.1"

    modCompileOnly "mezz.jei:jei-${minecraft_version}-lib:${jei_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"

    modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-forge:${rei_version}")
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-forge:${rei_version}")
    modCompileOnly("dev.architectury:architectury-forge:9.0.7")
    compileOnly("me.shedaniel.cloth:basic-math:0.6.1")

    if (recipeViewer == "jei") {
        modLocalRuntime "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"
    } else if (recipeViewer == "rei") {
        modLocalRuntime("me.shedaniel:RoughlyEnoughItems-forge:${rei_version}")
        modLocalRuntime("me.shedaniel.cloth:cloth-config-forge:11.0.99")
        modLocalRuntime("dev.architectury:architectury-forge:9.0.7")
        localRuntime("me.shedaniel.cloth:basic-math:0.6.1")
    }
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    toolchain.languageVersion = JavaLanguageVersion.of(17)

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "simplebbq",
                "Specification-Vendor"    : "Si_hen",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "Si_hen",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
